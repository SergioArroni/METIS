name: CI Tests and Version Bump

on:
  push:
    branches:
      - development
      - staging
      - main
  pull_request:
    branches:
      - development
      - staging
      - main

# Cancel previous runs of the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Ruff linter (non-blocking)
        id: ruff_check
        continue-on-error: true
        run: |
          echo "Running Ruff linter..."
          uvx ruff check metis tests scripts examples --output-format=github || true

      - name: Run Ruff formatter check (non-blocking)
        id: ruff_format
        continue-on-error: true
        run: |
          echo "Checking code formatting..."
          uvx ruff format --check metis tests scripts examples || true

      - name: Lint summary
        if: always()
        run: |
          echo "=== Lint Results ==="
          if [ "${{ steps.ruff_check.outcome }}" != "success" ]; then
            echo "⚠️  Ruff linter found issues (non-blocking)"
          else
            echo "✅ Ruff linter passed"
          fi
          if [ "${{ steps.ruff_format.outcome }}" != "success" ]; then
            echo "⚠️  Code formatting issues found (non-blocking)"
          else
            echo "✅ Code formatting passed"
          fi
          echo "Continuing with build..."
          exit 0

  test:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          uv pip install -e .[ci]

      - name: Run unit tests with coverage
        id: unit_tests
        run: |
          uv run pytest tests/unit/ \
            --cov=metis \
            --cov-report=xml --cov-report=term -v

      - name: Run integration tests
        id: integration_tests
        continue-on-error: true
        run: |
          uv run pytest tests/integration/ -v

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Check if all tests passed
        if: always()
        run: |
          if [ "${{ steps.unit_tests.outcome }}" != "success" ]; then
            echo "⚠️ Unit tests failed but continuing (set as continue-on-error)"
          fi
          if [ "${{ steps.integration_tests.outcome }}" != "success" ]; then
            echo "⚠️  Integration tests failed but continuing (set as continue-on-error)"
          fi
          echo "✅ All unit tests passed successfully!"

  sonar:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  version-bump:
    runs-on: ubuntu-latest
    needs: [test, sonar]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/development')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12.8

      - name: Create virtual environment
        run: uv venv

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Get branch name
        id: branch
        run: |
          echo "name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          uv run python scripts/bump_version.py auto --branch ${{ steps.branch.outputs.name }}
          NEW_VERSION=$(uv run python -c "import sys; sys.path.insert(0, '.'); from version import __version__; print(__version__)")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Commit and push version change
        run: |
          git add version.py
          git diff --staged --quiet || (git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]" && git push)
