[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis-val"
dynamic = ["version"]
description = "A modular framework for evaluating synthetic tabular data quality, utility, and privacy preservation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Sergio Arroni", email = "sergio.arroni@example.com" }]
keywords = [
    "synthetic-data",
    "data-quality",
    "privacy",
    "machine-learning",
    "data-evaluation",
    "tabular-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "scipy>=1.16.3",
    "scikit-learn>=1.5.2",
    "pyyaml>=6.0.3",
    "click>=8.3.1",
    "rich>=14.2.0",
    "imbalanced-learn>=0.12.4",
    "sdv>=1.32.0",
    "pgmpy>=0.1.26",
    "scikit-posthocs>=0.11.4",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "optuna>=3.4.0",
    "smartnoise-synth>=1.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
    "pre-commit>=4.5.1",
    "mypy>=1.7.0",
]
ci = ["pytest>=9.0.2", "pytest-cov>=7.0.0", "ruff>=0.14.10"]
ml = ["catboost>=1.2.8", "xgboost>=3.1.2", "lightgbm>=4.6.0"]
diffusion = ["synthcity>=0.2.12"]
docs = ["mkdocs-material>=9.0", "mkdocs-minify-plugin>=0.7"]
all = ["metis-val[dev,ml]"]

[project.scripts]
metis = "metis.interface.cli:main"

[project.urls]
Homepage = "https://github.com/SergioArroni/METIS"
Documentation = "https://SergioArroni.github.io/METIS/"
Repository = "https://github.com/SergioArroni/METIS"
Issues = "https://github.com/SergioArroni/METIS/issues"

[tool.hatch.version]
path = "version.py"
pattern = "__version__\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.hatch.build.targets.wheel]
packages = ["metis"]

[tool.hatch.build.targets.sdist]
include = ["/metis", "/version.py", "/README.md", "/LICENSE"]
exclude = ["paper/", "scripts/", "data/", "catboost_info/", "build/"]

# ============================================
# Ruff Configuration
# ============================================
[tool.ruff]
target-version = "py312"
line-length = 100 # Más razonable que 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".ruff_cache",
    ".pytest_cache",
    "catboost_info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate (commented code)
    "PL",  # pylint
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults
    "B905",    # zip without explicit strict
    "ARG001",  # unused function argument (common in interfaces)
    "ARG002",  # unused method argument
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "ERA001",  # commented code (permitir comentarios)
    "SIM108",  # use ternary operator (puede reducir legibilidad)
]
# Autofix seguro
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",  # Unused arguments in tests are fine
    "S101", # assert is expected in tests
    "PLR",  # Pylint rules relaxed for tests
]
"examples/**/*.py" = [
    "ARG", # Unused arguments in examples
    "ERA", # Allow commented code in examples
]
"scripts/**/*.py" = [
    "PLR", # Relaxed for scripts
]

[tool.ruff.lint.isort]
known-first-party = ["metis"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ============================================
# Pytest Configuration
# ============================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "-ra"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================
# Coverage Configuration
# ============================================
[tool.coverage.run]
source = ["metis"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstract",
    "pass",
    "\\.\\.\\.",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

# ============================================
# MyPy Configuration
# ============================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "examples/", "scripts/"]
