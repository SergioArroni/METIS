[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metis-val"
dynamic = ["version"]
description = "A modular framework for evaluating synthetic tabular data quality, utility, and privacy preservation"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Sergio Arroni", email = "sergioarroni@outlook.com" }]
keywords = [
    "synthetic-data",
    "data-quality",
    "privacy",
    "machine-learning",
    "data-evaluation",
    "tabular-data",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=2.5.5",
    "pandas>=2.3.3",  # sdv and smartnoise-synth still cap pandas below 3
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
    "pyyaml>=6.0.3",
    # Utility metrics (CatBoost trainer) are imported by the metric registry:
    # without it ``import metis`` fails, and CI installs ``.[ci]`` only.
    "catboost>=1.2.10",
    # Generators of the benchmark (metis.sota_models): SDV 2 (CTGAN, TVAE,
    # Gaussian copula), pgmpy (Bayesian network), smartnoise (DP-CTGAN), torch.
    "sdv>=2.2.0",
    "pgmpy>=1.1.2",
    "smartnoise-synth>=1.0.8",
    "torch>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "pre-commit>=4.5.1",
    "mypy>=2.4.1",
]
ci = ["pytest>=9.2.0", "pytest-cov>=7.1.0", "ruff>=0.17.5"]
ml = ["catboost>=1.2.10", "xgboost>=3.4.1", "lightgbm>=4.7.0"]
diffusion = ["synthcity>=0.2.12"]
docs = ["mkdocs-material>=9.0", "mkdocs-minify-plugin>=0.7"]
all = ["metis-val[dev,ml]"]

[project.scripts]
metis = "metis.interface.cli:main"

[project.urls]
Homepage = "https://github.com/SergioArroni/METIS"
Documentation = "https://SergioArroni.github.io/METIS/"
Repository = "https://github.com/SergioArroni/METIS"
Issues = "https://github.com/SergioArroni/METIS/issues"

[tool.hatch.version]
path = "version.py"
pattern = "__version__\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.hatch.build.targets.wheel]
packages = ["metis"]
# Local run outputs, not package data: calibration cache files and benchmark
# results live inside the source tree but must not ship in the wheel.
exclude = [
    "metis/calibrate/cache/*.json",
    "metis/sota_models/results/**",
]

[tool.hatch.build.targets.sdist]
include = ["/metis", "/version.py", "/README.md", "/LICENSE"]
exclude = [
    "paper/",
    "scripts/",
    "data/",
    "catboost_info/",
    "build/",
    "/metis/calibrate/cache/*.json",
    "/metis/sota_models/results/",
]

# ============================================
# Ruff Configuration
# ============================================
[tool.ruff]
target-version = "py314"
line-length = 100 # Más razonable que 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".ruff_cache",
    ".pytest_cache",
    "catboost_info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate (commented code)
    "PL",  # pylint
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults
    "B905",    # zip without explicit strict
    "ARG001",  # unused function argument (common in interfaces)
    "ARG002",  # unused method argument
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "ERA001",  # commented code (permitir comentarios)
    "SIM108",  # use ternary operator (puede reducir legibilidad)
]
# Autofix seguro
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",  # Unused arguments in tests are fine
    "S101", # assert is expected in tests
    "PLR",  # Pylint rules relaxed for tests
]
"examples/**/*.py" = [
    "ARG", # Unused arguments in examples
    "ERA", # Allow commented code in examples
]
"scripts/**/*.py" = [
    "PLR", # Relaxed for scripts
]

[tool.ruff.lint.isort]
known-first-party = ["metis"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ============================================
# Pytest Configuration
# ============================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "-ra"]
# A deprecation raised from METIS code fails the test; those inside other libraries are shown.
filterwarnings = [
    "error::DeprecationWarning:metis.*",
    "error::FutureWarning:metis.*",
]

# ============================================
# Coverage Configuration
# ============================================
[tool.coverage.run]
source = ["metis"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstract",
    "pass",
    "\\.\\.\\.",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

# ============================================
# MyPy Configuration
# ============================================
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "examples/", "scripts/"]
