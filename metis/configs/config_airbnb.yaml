# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN PARA DATASET: AIRBNB BARCELONA
# ═══════════════════════════════════════════════════════════════════════════════
# Dataset: Airbnb Barcelona (~19,410 registros)
# Target: price (regresión)
# ═══════════════════════════════════════════════════════════════════════════════

# ── 1. DATOS ─────────────────────────────────────────────────────────────────

data:
  real: "data/real/airbnb_barcelona.csv"
  synthetic: "None"
  target: "price"
  task_type: "regression"
  real_separator: ","
  synth_separator: "None"

  schema:
    # Identificadores
    id: id
    host_id: id
    # Texto (alta cardinalidad)
    name: nominal
    host_name: nominal
    license: nominal
    # Geográficas
    neighbourhood_group: nominal
    neighbourhood: nominal
    latitude: continuous
    longitude: continuous
    # Tipo de alojamiento
    room_type: nominal
    # Target
    price: continuous
    # Restricciones
    minimum_nights: {type: discrete, step: 1}
    # Reseñas
    number_of_reviews: {type: discrete, step: 1}
    reviews_per_month: {type: discrete, step: 0.01}
    number_of_reviews_ltm: {type: discrete, step: 1}
    last_review: {type: continuous, datetime: true}
    # Actividad del host
    calculated_host_listings_count: {type: discrete, step: 1}
    # Disponibilidad
    availability_365: {type: discrete, step: 1}

# ── 2. MÉTRICAS (compartidas por pipeline, calibración y benchmark) ──────────

metrics:
  # Fidelity via shortcuts (categoria/subcategoria)
  - "fidelity.global"
  - "fidelity.marginal.tails"
  - "fidelity.marginal.scales"
  - "fidelity.marginal.coverage"
  - "fidelity.conditional"
  # Utility:
  # Utility as a substitute for real training data: TSTR only.  TTS, TRTS
  # and TTRS measure other things (TTRS gave 0.89-0.92 to useless tables).
  - "utility.tstr"
  - "utility.log_loss"
  # Privacy via subcategory shortcuts:
  - "privacy.dataset_based.attacks"
  - "privacy.dataset_based.syntactic"
  - "privacy.dataset_based.empirical_similarity"

# ── 3. REPRODUCIBILIDAD ─────────────────────────────────────────────────────

reproducibility:
  seed: 42

# ── 4. CALIBRACIÓN (opcional) ────────────────────────────────────────────────

calibration:
  n_iterations: 10
  sample_percentage: 100.0
  n_jobs: 1

# ── 5. EVALUACIÓN (pipeline normal con CSV sintético) ────────────────────────

evaluation:
  n_runs: 1

# ── 6. BENCHMARK (opcional — comparación de generadores) ─────────────────────

benchmark:
  enabled: true
  output_dir: "metis/sota_models/results/benchmark_airbnb"
  n_runs: 5
  sample_ratio: 1.0

  generators:
    # Baselines
    - name: "real_data"
      params: {}
    - name: "uniform_noise"
      params: {}
    - name: "bootstrap"
      params: {}
    - name: "smotenc"
      params:
        k_neighbors: 5
    - name: "delete_zero"
      params:
        deletion_rate: 0.5
    - name: "delete_mean"
      params:
        deletion_rate: 0.5
    - name: "gaussian_copula"
      params: {}
    # SOTA
    - name: "bn"
      params:
        max_parents: 3
    - name: "cart"
      params:
        max_depth: 10
        min_samples_split: 10
    - name: "ctgan"
      params:
        epochs: 300
        batch_size: 500
    - name: "tvae"
      params:
        epochs: 300
        batch_size: 500
    - name: "dpctgan"
      params:
        epsilon: 1.0
        epochs: 300
        batch_size: 500
        sigma: 1.0
        # Public bounds (cost no ε): domain limits of the Inside Airbnb schema
        # and the Barcelona municipal box, rounded, not the observed min/max.
        # With ~3900 complete training rows, inferring 10 bounds with DP failed.
        # last_review is a datetime passed as epoch seconds: 2008-01-01..2026-01-01.
        bounds:
          availability_365: [0, 365]
          calculated_host_listings_count: [0, 600]
          last_review: [1199145600, 1767225600]
          latitude: [41.30, 41.50]
          longitude: [2.05, 2.25]
          minimum_nights: [0, 1125]
          number_of_reviews: [0, 2000]
          number_of_reviews_ltm: [0, 1000]
          price: [0, 10000]
          reviews_per_month: [0, 100]

  statistical_test:
    method: "friedman-nemenyi"
    alpha: 0.05

# ── 7. REPORTES ──────────────────────────────────────────────────────────────

report:
  formats: ["json", "md"]
  output_dir: "reports/run_airbnb"
