# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN PARA DATASET: RRHH ATTRITION
# ═══════════════════════════════════════════════════════════════════════════════
# Dataset: IBM HR Analytics Employee Attrition
# Target: Attrition (clasificación binaria)
# ═══════════════════════════════════════════════════════════════════════════════

# ── 1. DATOS ─────────────────────────────────────────────────────────────────

data:
  real: "data/real/rrhh.csv"
  synthetic: "None"
  target: "Attrition"
  task_type: "classification"
  real_separator: ","
  synth_separator: "None"

  schema:
    Age: continuous
    Attrition: categorical
    BusinessTravel: categorical
    DailyRate: continuous
    Department: categorical
    DistanceFromHome: continuous
    Education:
      type: ordinal
      levels: [1, 2, 3, 4, 5]
    EducationField: categorical
    EmployeeCount: id  # constant=1, excluded
    EmployeeNumber: id
    EnvironmentSatisfaction:
      type: ordinal
      levels: [1, 2, 3, 4]
    Gender: categorical
    HourlyRate: continuous
    JobInvolvement:
      type: ordinal
      levels: [1, 2, 3, 4]
    JobLevel: continuous
    JobRole: categorical
    JobSatisfaction:
      type: ordinal
      levels: [1, 2, 3, 4]
    MaritalStatus: categorical
    MonthlyIncome: continuous
    MonthlyRate: continuous
    NumCompaniesWorked: continuous
    Over18: id  # constant='Y', excluded
    OverTime: categorical
    PercentSalaryHike: continuous
    PerformanceRating:
      type: ordinal
      levels: [1, 2, 3, 4]
    RelationshipSatisfaction:
      type: ordinal
      levels: [1, 2, 3, 4]
    StandardHours: id  # constant=80, excluded
    StockOptionLevel: continuous
    TotalWorkingYears: continuous
    TrainingTimesLastYear: continuous
    WorkLifeBalance:
      type: ordinal
      levels: [1, 2, 3, 4]
    YearsAtCompany: continuous
    YearsInCurrentRole: continuous
    YearsSinceLastPromotion: continuous
    YearsWithCurrManager: continuous

# ── 2. MÉTRICAS (compartidas por pipeline, calibración y benchmark) ──────────

metrics:
  # Fidelity via shortcuts (categoria/subcategoria)
  - "fidelity.global"
  - "fidelity.marginal.tails"
  - "fidelity.marginal.scales"
  - "fidelity.marginal.coverage"
  - "fidelity.conditional"
  # Utility:
  - "utility.tts"
  - "utility.tstr"
  - "utility.trts"
  - "utility.ttrs"
  # Privacy via subcategory shortcuts:
  - "privacy.dataset_based.attribute_inference"
  - "privacy.dataset_based.reidentification"
  - "privacy.dataset_based.empirical_similarity"

# ── 3. REPRODUCIBILIDAD ─────────────────────────────────────────────────────

reproducibility:
  seed: 42

# ── 4. CALIBRACIÓN (opcional) ────────────────────────────────────────────────

calibration:
  n_iterations: 5
  sample_percentage: 100.0
  n_jobs: 1
  tune_aggregators: true

# ── 5. EVALUACIÓN (pipeline normal con CSV sintético) ────────────────────────

evaluation:
  n_runs: 1

# ── 6. BENCHMARK (opcional — comparación de generadores) ─────────────────────

benchmark:
  enabled: true
  output_dir: "metis/sota_models/results/benchmark_rrhh"
  n_runs: 5
  sample_ratio: 1.0

  generators:
    # Baselines
    - name: "real_data"
      params: {}
    - name: "uniform_noise"
      params: {}
    - name: "bootstrap"
      params: {}
    - name: "smotenc"
      params:
        k_neighbors: 5
    - name: "delete_zero"
      params:
        deletion_rate: 0.5
    - name: "delete_mean"
      params:
        deletion_rate: 0.5
    - name: "gaussian_copula"
      params: {}
    # SOTA
    - name: "bn"
      params:
        max_parents: 3
    - name: "cart"
      params:
        max_depth: 10
        min_samples_split: 10
    - name: "ctgan"
      params:
        epochs: 300
        batch_size: 500
    - name: "tvae"
      params:
        epochs: 300
        batch_size: 500
    - name: "dpctgan"
      params:
        epsilon: 1.0
        epochs: 300
        batch_size: 500
        sigma: 1.0

  statistical_test:
    method: "friedman-nemenyi"
    alpha: 0.05

# ── 7. REPORTES ──────────────────────────────────────────────────────────────

report:
  formats: ["json", "md"]
  output_dir: "reports/run_rrhh"
