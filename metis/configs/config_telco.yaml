# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN PARA DATASET: TELCO CUSTOMER CHURN
# ═══════════════════════════════════════════════════════════════════════════════
# Dataset: Telco Customer Churn (~7,043 registros)
# Target: Churn (clasificación binaria)
# ═══════════════════════════════════════════════════════════════════════════════

# ── 1. DATOS ─────────────────────────────────────────────────────────────────

data:
  real: "data/real/telco.csv"
  synthetic: "None"
  target: "Churn"
  task_type: "classification"
  real_separator: ","
  synth_separator: "None"

  schema:
    customerID: id
    gender: nominal
    SeniorCitizen: nominal
    Partner: nominal
    Dependents: nominal
    PhoneService: nominal
    MultipleLines: nominal
    InternetService: nominal
    OnlineSecurity: nominal
    OnlineBackup: nominal
    DeviceProtection: nominal
    TechSupport: nominal
    StreamingTV: nominal
    StreamingMovies: nominal
    tenure: {type: discrete, step: 1}
    Contract: nominal
    PaperlessBilling: nominal
    PaymentMethod: nominal
    MonthlyCharges: continuous
    TotalCharges: continuous
    Churn: nominal

# ── 2. MÉTRICAS (compartidas por pipeline, calibración y benchmark) ──────────

metrics:
  # Fidelity via shortcuts (categoria/subcategoria)
  - "fidelity.global"
  - "fidelity.marginal.tails"
  - "fidelity.marginal.scales"
  - "fidelity.marginal.coverage"
  - "fidelity.conditional"
  # Utility:
  # Utility as a substitute for real training data: TSTR only.  TTS, TRTS
  # and TTRS measure other things (TTRS gave 0.89-0.92 to useless tables).
  - "utility.tstr"
  - "utility.log_loss"
  # Privacy via subcategory shortcuts:
  - "privacy.dataset_based.attacks"
  - "privacy.dataset_based.syntactic"
  - "privacy.dataset_based.empirical_similarity"

# ── 3. REPRODUCIBILIDAD ─────────────────────────────────────────────────────

reproducibility:
  seed: 42

# ── 4. CALIBRACIÓN (opcional) ────────────────────────────────────────────────

calibration:
  n_iterations: 10
  sample_percentage: 100.0
  n_jobs: 1

# ── 5. EVALUACIÓN (pipeline normal con CSV sintético) ────────────────────────

evaluation:
  n_runs: 1

# ── 6. BENCHMARK (opcional — comparación de generadores) ─────────────────────

benchmark:
  enabled: true
  output_dir: "metis/sota_models/results/benchmark_telco"
  n_runs: 5
  sample_ratio: 1.0

  generators:
    # Baselines
    - name: "real_data"
      params: {}
    - name: "uniform_noise"
      params: {}
    - name: "bootstrap"
      params: {}
    - name: "smotenc"
      params:
        k_neighbors: 5
    - name: "delete_zero"
      params:
        deletion_rate: 0.5
    - name: "delete_mean"
      params:
        deletion_rate: 0.5
    - name: "gaussian_copula"
      params: {}
    # SOTA
    - name: "bn"
      params:
        max_parents: 3
    - name: "cart"
      params:
        max_depth: 10
        min_samples_split: 10
    - name: "ctgan"
      params:
        epochs: 300
        batch_size: 500
    - name: "tvae"
      params:
        epochs: 300
        batch_size: 500
    - name: "dpctgan"
      params:
        epsilon: 1.0
        epochs: 300
        batch_size: 500
        sigma: 1.0

  statistical_test:
    method: "friedman-nemenyi"
    alpha: 0.05

# ── 7. REPORTES ──────────────────────────────────────────────────────────────

report:
  formats: ["json", "md"]
  output_dir: "reports/run_telco"
