# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN PARA DATASET: TELCO CUSTOMER CHURN
# ═══════════════════════════════════════════════════════════════════════════════
# Dataset: Telco Customer Churn (~7,043 registros)
# Target: Churn (clasificación binaria)
# ═══════════════════════════════════════════════════════════════════════════════

# ── 1. DATOS ─────────────────────────────────────────────────────────────────

data:
  real: "data/real/telco.csv"
  synthetic: "None"
  target: "Churn"
  task_type: "classification"
  real_separator: ","
  synth_separator: "None"

  schema:
    customerID: id
    gender: categorical
    SeniorCitizen: boolean
    Partner: boolean
    Dependents: boolean
    PhoneService: boolean
    MultipleLines: categorical
    InternetService: categorical
    OnlineSecurity: categorical
    OnlineBackup: categorical
    DeviceProtection: categorical
    TechSupport: categorical
    StreamingTV: categorical
    StreamingMovies: categorical
    tenure: continuous
    Contract: categorical
    PaperlessBilling: boolean
    PaymentMethod: categorical
    MonthlyCharges: continuous
    TotalCharges: continuous
    Churn: boolean

# ── 2. MÉTRICAS (compartidas por pipeline, calibración y benchmark) ──────────

metrics:
  # Fidelity via shortcuts (categoria/subcategoria)
  - "fidelity.global"
  - "fidelity.marginal.tails"
  - "fidelity.marginal.scales"
  - "fidelity.marginal.coverage"
  - "fidelity.conditional"
  # Utility:
  - "utility.tts"
  - "utility.tstr"
  - "utility.trts"
  - "utility.ttrs"
  # Privacy via subcategory shortcuts:
  - "privacy.dataset_based.attribute_inference"
  - "privacy.dataset_based.reidentification"
  - "privacy.dataset_based.empirical_similarity"

# ── 3. REPRODUCIBILIDAD ─────────────────────────────────────────────────────

reproducibility:
  seed: 42

# ── 4. CALIBRACIÓN (opcional) ────────────────────────────────────────────────

calibration:
  n_iterations: 5
  sample_percentage: 100.0
  n_jobs: 1
  tune_aggregators: true

# ── 5. EVALUACIÓN (pipeline normal con CSV sintético) ────────────────────────

evaluation:
  n_runs: 1

# ── 6. BENCHMARK (opcional — comparación de generadores) ─────────────────────

benchmark:
  enabled: true
  output_dir: "metis/sota_models/results/benchmark_telco"
  n_runs: 5
  sample_ratio: 1.0

  generators:
    # Baselines
    - name: "real_data"
      params: {}
    - name: "uniform_noise"
      params: {}
    - name: "bootstrap"
      params: {}
    - name: "smotenc"
      params:
        k_neighbors: 5
    - name: "delete_zero"
      params:
        deletion_rate: 0.5
    - name: "delete_mean"
      params:
        deletion_rate: 0.5
    - name: "gaussian_copula"
      params: {}
    # SOTA
    - name: "bn"
      params:
        max_parents: 3
    - name: "cart"
      params:
        max_depth: 10
        min_samples_split: 10
    - name: "ctgan"
      params:
        epochs: 300
        batch_size: 500
    - name: "tvae"
      params:
        epochs: 300
        batch_size: 500
    - name: "dpctgan"
      params:
        epsilon: 1.0
        epochs: 300
        batch_size: 500
        sigma: 1.0

  statistical_test:
    method: "friedman-nemenyi"
    alpha: 0.05

# ── 7. REPORTES ──────────────────────────────────────────────────────────────

report:
  formats: ["json", "md"]
  output_dir: "reports/run_telco"
