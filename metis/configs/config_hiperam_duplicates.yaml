# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN PARA DATASET: HIPERAM CON DUPLICADOS
# ═══════════════════════════════════════════════════════════════════════════════
# Dataset: HiperAM — fabricación aditiva metálica Wire-DED (550 filas, 41 dupl.)
# Target: None (solo fidelity)
# ═══════════════════════════════════════════════════════════════════════════════

# ── 1. DATOS ─────────────────────────────────────────────────────────────────

data:
  real: "data/real/hiperam_clean_data_con_duplicados.csv"
  synthetic: "None"
  target: "None"
  task_type: "None"
  real_separator: ","
  synth_separator: ","

  schema:
    "BUILD ID": id                                     # ID pieza
    "LASER POWER [W]": continuous                       # 600-1200
    "PRINTING SPEED [mm/s]": continuous                  # 2.5-28
    "FEED SPEED [mm/s] / EXT MULT.": continuous          # 3.75-70
    "PROCESS SHIELD GAS FLOW [l/min]": categorical       # 3 valores: 14.5, 15, 20
    "HOTWIRE CURRENT [A]": categorical                   # 3 valores: 2, 50, 75
    "LAYER THICKNESS [mm]": continuous                   # 0.29-2.0
    "VISUAL RESULT": categorical                         # 4 clases: 0, 1, 2, 3

# ── 2. MÉTRICAS (compartidas por pipeline, calibración y benchmark) ──────────

metrics:
  # Fidelity — Global:
  - "fidelity.correlation_matrix"
  - "fidelity.mmd"
  - "fidelity.energy_distance"
  - "fidelity.outliers_coverage"
  # Fidelity — Marginal (colas):
  - "fidelity.ks"
  - "fidelity.wasserstein"
  - "fidelity.anderson_darling"
  - "fidelity.hellinger"
  - "fidelity.kde_ise"
  - "fidelity.delta_exceedance"
  # Fidelity — Marginal (escalas):
  - "fidelity.delta_mean"
  - "fidelity.delta_median"
  - "fidelity.delta_iqr"
  - "fidelity.delta_mad"
  - "fidelity.cohens_d"
  # Fidelity — Marginal (cobertura):
  - "fidelity.tvd"
  - "fidelity.js"
  - "fidelity.kl"
  - "fidelity.psi"
  - "fidelity.entropy_delta"
  - "fidelity.gini_delta"
  # Fidelity — Condicional (num↔num):
  - "fidelity.pearson"
  - "fidelity.spearman"
  - "fidelity.mi"
  # Fidelity — Condicional (num↔cat):
  - "fidelity.eta_squared"
  - "fidelity.point_biserial"
  - "fidelity.kruskal_epsilon"
  # Fidelity — Condicional (cat↔cat):
  - "fidelity.cramers_v"
  - "fidelity.theils_u"
  - "fidelity.chi2_stat"

# ── 3. REPRODUCIBILIDAD ─────────────────────────────────────────────────────

reproducibility:
  seed: 42

# ── 4. CALIBRACIÓN (opcional) ────────────────────────────────────────────────

calibration:
  n_iterations: 5
  sample_percentage: 100.0
  n_jobs: 1
  tune_aggregators: true

# ── 5. BENCHMARK (opcional — comparación de generadores) ─────────────────────

benchmark:
  enabled: true
  output_dir: "metis/sota_models/results/benchmark_hiperam_duplicates"
  n_runs: 5
  sample_ratio: 1.0

  generators:
    # Baselines
    - name: "real_data"
      params: {}
    - name: "uniform_noise"
      params: {}
    - name: "bootstrap"
      params: {}
    - name: "delete_zero"
      params:
        deletion_rate: 0.5
    - name: "delete_mean"
      params:
        deletion_rate: 0.5
    - name: "gaussian_copula"
      params: {}
    # SOTA
    - name: "bn"
      params:
        max_parents: 3
    - name: "cart"
      params:
        max_depth: 10
        min_samples_split: 10
    - name: "ctgan"
      params:
        epochs: 200
        batch_size: 100

  statistical_test:
    method: "friedman-nemenyi"
    alpha: 0.05

# ── 6. REPORTES ──────────────────────────────────────────────────────────────

report:
  formats: ["json", "md"]
  output_dir: "reports/run_hiperam_duplicates"
